name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android/package-lock.json

      - name: Install Project Dependencies
        run: |
          cd android
          npm ci

      - name: Sync Capacitor Assets
        run: |
          cd android
          npx cap sync android

      - name: Build Android App (Debug APK)
        run: |
          cd android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitor-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
